<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand">CTA</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="logs.html">Network Logs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="alerts.html">Alerts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="models.html">ML Models</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="settings.html">Settings</a>
          </li>
        </ul>
        <div class="d-flex">
          <span class="navbar-text me-3" id="userInfo"></span>
          <button class="btn btn-sm btn-outline-secondary" id="logoutBtn">Вийти</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row g-3 mb-4" id="stats"></div>

    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="h6">Імпорт логів (CSV / JSON)</h2>
            <div class="d-flex gap-2">
              <input class="form-control" type="file" id="logFile" accept=".csv,.json">
              <button class="btn btn-primary" id="uploadBtn">Завантажити</button>
              <button class="btn btn-outline-primary" id="analyzeBtn">Запустити аналіз</button>
            </div>
            <div class="small text-muted mt-2" id="importStatus"></div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="h6">Швидкі дії</h2>
            <div class="d-flex gap-2 flex-wrap">
              <button class="btn btn-sm btn-outline-success" onclick="window.location.href='logs.html'">Переглянути логи</button>
              <button class="btn btn-sm btn-outline-warning" onclick="window.location.href='alerts.html'">Перевірити сповіщення</button>
              <button class="btn btn-sm btn-outline-info" onclick="window.location.href='models.html'">Керувати моделями</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Активність за годинами</h2>
          <canvas id="activityChart" height="180"></canvas>
        </div></div>
      </div>
      <div class="col-md-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Загрози за типами</h2>
          <canvas id="typeChart" height="180"></canvas>
        </div></div>
      </div>
      <div class="col-12">
        <div class="card"><div class="card-body">
          <h2 class="h6">Статистика за IP</h2>
          <canvas id="ipChart" height="80"></canvas>
        </div></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h6">Останні загрози</h2>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr><th>#</th><th>Log</th><th>Тип</th><th>Ймовірність</th><th>Рівень</th><th>Час</th><th>Дії</th></tr>
            </thead>
            <tbody id="threats"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
