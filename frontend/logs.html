<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA — Мережеві логи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand">CTA</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="logs.html">Network Logs</a></li>
          <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>
          <li class="nav-item"><a class="nav-link" href="models.html">ML Models</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        </ul>
        <div class="d-flex">
          <span class="navbar-text me-3" id="userInfo"></span>
          <button class="btn btn-sm btn-outline-secondary" id="logoutBtn">Вийти</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="h4 mb-3">Список мережевих логів</h1>
    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex gap-2 flex-wrap">
          <input class="form-control" type="file" id="logFile" accept=".csv,.json" style="max-width: 320px;">
          <button class="btn btn-primary" id="uploadBtn">Імпортувати</button>
        </div>
        <div class="small text-muted mt-2" id="importStatus"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm table-hover">
            <thead>
              <tr>
                <th>#</th><th>IP</th><th>Час</th><th>Протокол</th><th>Порт</th>
                <th>Відправлено</th><th>Отримано</th><th>Статус</th><th></th>
              </tr>
            </thead>
            <tbody id="logsTable"></tbody>
          </table>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="prevBtn">Назад</button>
          <button class="btn btn-sm btn-outline-secondary" id="nextBtn">Далі</button>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
