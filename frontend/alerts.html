<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA — Alerts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand">CTA</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="logs.html">Network Logs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="alerts.html">Alerts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="models.html">ML Models</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="settings.html">Settings</a>
          </li>
        </ul>
        <div class="d-flex">
          <span class="navbar-text me-3" id="userInfo"></span>
          <button class="btn btn-sm btn-outline-secondary" id="logoutBtn">Вийти</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row mb-4">
      <div class="col">
        <h1>Журнал попереджень</h1>
      </div>
      <div class="col-auto">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-primary active" onclick="filterAlerts('all')">Всі</button>
          <button type="button" class="btn btn-outline-primary" onclick="filterAlerts('new')">Нові</button>
          <button type="button" class="btn btn-outline-primary" onclick="filterAlerts('in_progress')">В процесі</button>
          <button type="button" class="btn btn-outline-primary" onclick="filterAlerts('resolved')">Вирішені</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>Повідомлення</th>
                <th>Рівень</th>
                <th>Статус</th>
                <th>Створено</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody id="alertsTable">
              <tr><td colspan="6" class="text-center">Завантаження...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
