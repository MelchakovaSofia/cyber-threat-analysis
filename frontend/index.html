<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA — Вхід</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container" style="max-width: 420px; padding-top: 8vh;">
    <h1 class="h4 mb-4">Система аналізу кіберзагроз</h1>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" id="tabLogin" type="button">Вхід</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tabRegister" type="button">Реєстрація</button>
      </li>
    </ul>
    <div class="card">
      <div class="card-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="login">Логін</label>
            <input class="form-control" id="login" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-control" id="password" type="password" autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" type="submit" id="loginBtn">Увійти</button>
        </form>
        <form id="registerForm" class="d-none">
          <div class="mb-3">
            <label class="form-label" for="regLogin">Логін</label>
            <input class="form-control" id="regLogin" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="regEmail">Email</label>
            <input class="form-control" id="regEmail" type="email" autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="regPassword">Пароль</label>
            <input class="form-control" id="regPassword" type="password" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="regRole">Роль</label>
            <select class="form-select" id="regRole">
              <option value="analyst">Аналітик</option>
              <option value="admin">Адміністратор</option>
            </select>
          </div>
          <button class="btn btn-primary w-100" type="submit">Зареєструватися</button>
        </form>
        <div class="text-danger small mt-2 d-none" id="error"></div>
        <div class="text-success small mt-2 d-none" id="success"></div>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
