<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA — Налаштування</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand">CTA</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="logs.html">Network Logs</a></li>
          <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>
          <li class="nav-item"><a class="nav-link" href="models.html">ML Models</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link active" href="settings.html">Settings</a></li>
        </ul>
        <div class="d-flex">
          <span class="navbar-text me-3" id="userInfo"></span>
          <button class="btn btn-sm btn-outline-secondary" id="logoutBtn">Вийти</button>
        </div>
      </div>
    </div>
  </nav>
  <main class="container" style="max-width: 640px;">
    <h1 class="h4 mb-3">Налаштування системи</h1>
    <div class="card mb-3">
      <div class="card-body">
        <label class="form-label" for="apiUrl">URL REST API</label>
        <input class="form-control" id="apiUrl">
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" id="saveBtn">Зберегти</button>
          <button class="btn btn-outline-secondary" id="resetBtn">Скинути</button>
        </div>
        <div class="alert alert-success d-none mt-3 mb-0" id="saved">Збережено. Оновіть сторінку, щоб застосувати.</div>
      </div>
    </div>
    <p class="text-muted" id="health">Перевірка API...</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
