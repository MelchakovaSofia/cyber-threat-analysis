  name: cta-secret
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values with actual production values
  # You can use kubectl create secret generic or edit this file directly
  DATABASE_URL: "postgresql+psycopg2://cta:CHANGE_ME_PASSWORD@cta-postgres:5432/cta_db"
  SECRET_KEY: "CHANGE_ME_TO_STRONG_RANDOM_SECRET_KEY"
