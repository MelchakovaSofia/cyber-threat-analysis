apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cta-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # IMPORTANT: Replace cta.example.com with your actual domain
    - host: cta.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cta-backend
                port:
                  number: 80
