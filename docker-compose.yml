services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cta
      POSTGRES_PASSWORD: cta_password
      POSTGRES_DB: cta_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cta"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - mlmodels:/app/ml_models

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mlmodels:
